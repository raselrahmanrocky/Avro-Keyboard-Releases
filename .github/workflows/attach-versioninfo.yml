name: Sync Version Manifests

on:
  release:
    types: [published, prereleased, released, edited, deleted, unpublished]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate manifests from live releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          Write-Host "Fetching live non-draft releases from $env:GH_REPO..."
          
          # 1. Fetch live non-draft releases safely
          $releasesJson = gh release list --repo $env:GH_REPO --limit 30 --json tagName,isPrerelease,isDraft | ConvertFrom-Json
          $activeReleases = @($releasesJson | Where-Object { -not $_.isDraft })

          if (-not $activeReleases -or $activeReleases.Count -eq 0) {
              Write-Host "No active releases found in the repository."
              exit 0
          }

          # 2. Identify latest Stable and Beta releases
          $stableRel = $activeReleases | Where-Object { -not $_.isPrerelease } | Select-Object -First 1
          $betaRel   = $activeReleases | Where-Object { $_.isPrerelease } | Select-Object -First 1

          # Fallback rule: If no beta release exists, beta channel falls back to stable
          if (-not $betaRel) {
              Write-Host "No beta release found. Beta channel will fall back to stable release."
              $betaRel = $stableRel
          }

          # 3. Function to generate XML from a specific release
          function Generate-ManifestXml {
              param($release)
              if (-not $release) { return $null }

              $tag = $release.tagName
              Write-Host "Processing manifest for tag: $tag"
              $relData = gh release view $tag --repo $env:GH_REPO --json assets,publishedAt | ConvertFrom-Json
              $assets = $relData.assets

              # Architecture detection
              $setup32 = $assets | Where-Object { $_.name -like '*setup*.exe' -and ($_.name -like '*win32*' -or $_.name -like '*x86*') } | Select-Object -First 1
              $setup64 = $assets | Where-Object { $_.name -like '*setup*.exe' -and ($_.name -like '*win64*' -or $_.name -like '*x64*') } | Select-Object -First 1
              $legacy  = $assets | Where-Object { $_.name -like '*setup*.exe' -or $_.name -like '*.exe' } | Select-Object -First 1

              $downloadUrl = if ($setup64) {
                  "https://github.com/$env:GH_REPO/releases/download/$tag/$($setup64.name)"
              } elseif ($legacy) {
                  "https://github.com/$env:GH_REPO/releases/download/$tag/$($legacy.name)"
              } else {
                  "https://github.com/$env:GH_REPO/releases/tag/$tag"
              }

              $downloadUrl32 = if ($setup32) { "https://github.com/$env:GH_REPO/releases/download/$tag/$($setup32.name)" } else { $null }
              $downloadUrl64 = if ($setup64) { "https://github.com/$env:GH_REPO/releases/download/$tag/$($setup64.name)" } else { $null }

              # Version number parsing (e.g. v6.0.1-beta -> 6, 0, 1, 0)
              $cleanVer = $tag.TrimStart('v').TrimStart('V')
              $numOnly = ($cleanVer -split '-')[0]
              $parts = $numOnly.Split('.')

              $major = if ($parts.Length -gt 0 -and $parts[0] -ne '') { $parts[0] } else { "6" }
              $minor = if ($parts.Length -gt 1 -and $parts[1] -ne '') { $parts[1] } else { "0" }
              $rev   = if ($parts.Length -gt 2 -and $parts[2] -ne '') { $parts[2] } else { "0" }
              $build = if ($parts.Length -gt 3 -and $parts[3] -ne '') { $parts[3] } else { "0" }

              $date = if ($relData.publishedAt) {
                  ([DateTime]$relData.publishedAt).ToString("yyyy-MM-dd")
              } else {
                  (Get-Date).ToString("yyyy-MM-dd")
              }

              $xmlLines = @(
                  '<?xml version="1.0" encoding="utf-8"?>',
                  '<versioninfo>',
                  "  <versionmajor>$major</versionmajor>",
                  "  <versionminor>$minor</versionminor>",
                  "  <versionrevision>$rev</versionrevision>",
                  "  <versionbuild>$build</versionbuild>",
                  "  <downloadurl>$downloadUrl</downloadurl>"
              )

              if ($downloadUrl32) { $xmlLines += "  <downloadurl32>$downloadUrl32</downloadurl32>" }
              if ($downloadUrl64) { $xmlLines += "  <downloadurl64>$downloadUrl64</downloadurl64>" }

              $xmlLines += @(
                  "  <changelogurl>https://github.com/$env:GH_REPO/releases/tag/$tag</changelogurl>",
                  "  <productpageurl>https://github.com/$env:GH_REPO</productpageurl>",
                  "  <releasedate>$date</releasedate>",
                  "  <namedversion>Avro Keyboard $cleanVer</namedversion>",
                  '</versioninfo>'
              )

              return ($xmlLines -join "`r`n")
          }

          # 4. Generate XML manifests
          $stableXml = Generate-ManifestXml $stableRel
          $betaXml   = Generate-ManifestXml $betaRel

          if ($stableXml) {
              [System.IO.File]::WriteAllText("versioninfo.xml", $stableXml, [System.Text.Encoding]::UTF8)
              Write-Host "Generated versioninfo.xml from $($stableRel.tagName)"
          }

          if ($betaXml) {
              [System.IO.File]::WriteAllText("versioninfo_beta.xml", $betaXml, [System.Text.Encoding]::UTF8)
              Write-Host "Generated versioninfo_beta.xml from $($betaRel.tagName)"
          }

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Safely stage only files that exist
          [ -f "versioninfo.xml" ] && git add versioninfo.xml
          [ -f "versioninfo_beta.xml" ] && git add versioninfo_beta.xml
          
          if [ -n "$(git status --porcelain versioninfo*.xml)" ]; then
            git commit -m "chore: sync version manifests [skip ci]"
            git push origin main
            echo "Manifests successfully synced and pushed to main."
          else
            echo "Manifests are already up to date with live releases. Nothing to commit."
          fi
