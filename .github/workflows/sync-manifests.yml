name: Sync version manifests

on:
  release:
    types: [published, edited, deleted, unpublished, prereleased, released]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate manifests from live releases
        id: gen
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/gen_manifest.ps1

      - name: Commit and push manifests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # -A ব্যবহারের ফলে ফাইল তৈরি/আপডেট এবং ডিলিট দুটোই সঠিকভাবে স্টেজ হবে
          git add -A versioninfo.xml versioninfo_beta.xml
          
          if [ -n "$(git status --porcelain versioninfo*.xml)" ]; then
            git commit -m "chore: sync version manifests from live releases [skip ci]"
            git push origin main
            echo "Manifests successfully synced and pushed to main."
          else
            echo "No manifest changes to commit."
          fi

      - name: Attach manifest to the stable release (legacy clients)
        if: steps.gen.outputs.stable != '' && hashFiles('versioninfo.xml') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ steps.gen.outputs.stable }}" versioninfo.xml --repo "$GH_REPO" --clobber
